[package]
name = "qdist-rs"
version = "0.1.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"

[lib]
name = "qdist_rs_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.24"
pyo3 = { version = "0.24", features = ["abi3-py310"] }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
