[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "qdist-rs"
version = "0.1.0"
description = "Randomized distance finding for stabilizer and subsystem quantum codes"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-SA-4.0"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
benchmark = ["codedistance>=0.0.8"]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "qdist_rs._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
