[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quilt-rep-search"
version = "1.0.0"
description = "Choosing distance-preserving logical representatives for code quilts"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-SA-4.0"

# quilt-construction is the sibling release; qdist-rs is the crate in crates/qdist.
# Install both before this package (see README).
dependencies = [
    "numpy>=2",
    "ortools>=9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/quilt_rep_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
